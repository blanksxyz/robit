<!DOCTYPE html>
<html lang="en" style="background:#0B0E11">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>robit — the world's best traders. and you.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --ink:#0B0E11;--panel:#12161B;--panel2:#171C22;--line:#222A31;
  --gain:#2BE080;--gaindim:#123324;--loss:#FF5C7A;--lossdim:#2A1219;
  --text:#F2F5F3;--dim:#9AA8A0;--faint:#5F6C65;--blue:#7DB8FF;--bluedim:#12222E;--amber:#FFB84D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#0B0E11 !important;color:var(--text)}
body{font-family:'Space Grotesk',sans-serif;line-height:1.55;min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer;transition:transform .12s ease,box-shadow .2s ease,opacity .15s}
button:active{transform:scale(.97)}
::-webkit-scrollbar{height:4px;width:4px}
::-webkit-scrollbar-thumb{background:#222A31;border-radius:99px}
.chrome{font-family:'Unbounded',sans-serif;font-weight:900;display:inline-block;transform:skew(-10deg);color:var(--gain);text-shadow:2px -3px 0 #0E2A1A}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
.chrome{background:linear-gradient(180deg,#FBFFFD 0%,#CFFFE4 20%,#43E88E 44%,#0E3B22 56%,#04170D 60%,#2E8F55 63%,#8CF7BC 74%,#E9FFF3 90%,#FFFFFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(2px -3px 0 #0E2A1A)}}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes scrolltick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes floatc{0%,100%{margin-top:0}50%{margin-top:-10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header{position:sticky;top:0;z-index:30;background:rgba(11,14,17,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;cursor:pointer}
.r-tile{width:34px;height:34px;border-radius:10px;border:1.5px solid #1E3328;display:flex;align-items:center;justify-content:center}
.r-tile .chrome{font-size:17px}
.logo b{font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px}
.nav{display:flex;gap:2px;flex:1;justify-content:center}
.navbtn{font-size:13.5px;font-weight:700;color:var(--dim);background:none;border:none;border-radius:999px;padding:9px 14px}
.navbtn.on{color:var(--ink);background:var(--gain)}
.hright{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hbtn{font-size:13px;font-weight:700;border-radius:999px;padding:9px 15px}
.hbtn.ghost{color:var(--text);background:transparent;border:1.5px solid var(--line)}
.hbtn.solid{color:var(--ink);background:var(--gain);border:none;display:flex;align-items:center;gap:7px}
.uwrap{display:flex;align-items:center;gap:10px}
.uavatar{position:relative;overflow:hidden;width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--dim)}
.uavatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(11,14,17,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bnav button{flex:1;background:none;border:none;color:var(--faint);font-size:10.5px;font-weight:700;padding:9px 0 max(9px,env(safe-area-inset-bottom))}
.bnav button.on{color:var(--gain)}
.bnav .ic{font-size:16px;display:block;margin-bottom:2px}
@media(max-width:860px){.nav{display:none}.bnav{display:flex}body{padding-bottom:62px}.hbtn.ghost{display:none}}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.pagehead{margin-bottom:16px}
.pagehead h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(19px,3vw,24px)}
.pagehead p{color:var(--faint);font-size:13.5px;margin-top:2px}
.stories{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px}
.story{flex-shrink:0;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;text-align:left;color:var(--text)}
.story.live{border-color:var(--gain)}
.story .s1{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px}
.story .s2{font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-top:4px;color:var(--gain)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px}
.chip{flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--faint);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.chip.on{color:var(--text);border-color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;animation:slideUp .3s both;transition:transform .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-3px);border-color:#2E4437}
.card.livecard{border-color:#1E4A31}
.chead{display:flex;align-items:center;gap:11px;cursor:pointer}
.cavatar{position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--dim);flex-shrink:0}
.cavatar img,.pavatar img,.savatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.savatar{position:relative;overflow:hidden;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;color:var(--dim);flex-shrink:0}
.cname{font-weight:700;font-size:15px}
.cname span{color:var(--faint);font-weight:400;font-size:12px}
.cstat{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gain)}
.cstat .amber{color:var(--amber)}
.movebox{margin-top:13px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px}
.movebox.livebox{background:var(--gaindim);border-color:#1E4A31}
.movetop{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.movelabel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);letter-spacing:.1em}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.05em;white-space:nowrap}
.badge.v{color:var(--gain);background:var(--gaindim)}
.badge.c{color:var(--blue);background:var(--bluedim)}
.badge.hot{color:var(--amber);background:#3A2A10}
.badge.right{margin-left:auto}
.moveline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dir{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.dir.up{color:var(--gain)}.dir.dn{color:var(--loss)}
.tkr{font-family:'Unbounded',sans-serif;font-weight:900;font-size:22px}
.movewhat{font-size:13px;color:var(--dim)}
.movemeta{font-size:12.5px;color:var(--dim);margin-top:3px}
.plain{font-size:13px;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:10px;line-height:1.45}
.plain b{color:var(--gain);font-weight:700}
.entry{font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:6px;color:var(--dim)}
.entry b.up{color:var(--gain)}.entry b.dn{color:var(--loss)}
.btnrow{display:flex;gap:8px;margin-top:13px}
.copybtn{flex:1;font-weight:700;font-size:14px;color:var(--ink);background:var(--gain);border:none;border-radius:999px;padding:11px 0}
.whobtn{font-size:12px;font-weight:700;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 13px}
.votebtn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 11px}
.votebtn.bull{color:var(--gain);border-color:var(--gain)}
.votebtn.bear{color:var(--loss);border-color:var(--loss)}
.infocard{font-size:12.5px;color:var(--faint);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 15px;margin-bottom:16px;line-height:1.5}
.finefeed{text-align:center;font-size:11px;color:var(--faint);padding:22px 24px 0;line-height:1.6}
.jarg{border-bottom:1.5px dotted var(--dim);cursor:pointer}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:14px}
.pod{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 8px 14px;text-align:center;cursor:pointer}
.pod .cavatar{margin:0 auto 8px;width:52px;height:52px}
.pod b{font-size:13px;display:block}
.pod small{color:var(--faint);font-size:11px}
.pod .pct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;color:var(--gain);margin-top:6px}
.pod .medal{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);letter-spacing:.12em;margin-bottom:8px}
.pod.first{border-color:#1E4A31;box-shadow:0 0 46px rgba(43,224,128,.16);padding-top:24px}
.pod.first .cavatar{width:62px;height:62px}
.pod.first .pct{font-size:21px}
.board{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.brow{display:flex;align-items:center;gap:14px;padding:15px 20px;border-top:1px solid var(--line);cursor:pointer}
.brow:first-child{border-top:none}
.brow:hover{background:var(--panel2)}
.brow .rk{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--faint);width:24px}
.brow .cavatar{width:36px;height:36px;font-size:12px}
.brow .bm{flex:1;min-width:0}
.brow .bm b{font-size:14.5px}
.brow .bm small{display:block;color:var(--faint);font-size:12px}
.brow .rt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:var(--gain);text-align:right}
.brow .rt small{display:block;color:var(--faint);font-size:10.5px;font-weight:500}
.brow.you{background:linear-gradient(90deg,var(--gaindim),transparent);cursor:default}
.brow.you .rk,.brow.you .rt{color:var(--gain)}
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.pf-stats{grid-template-columns:1fr 1fr}}
.pf-stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center}
.pf-stat .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px}
.pf-stat .v.g{color:var(--gain)}.pf-stat .v.r{color:var(--loss)}
.pf-stat .l{font-size:11.5px;color:var(--faint);margin-top:3px}
.pf-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}
.pf-row .t{font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;width:66px}
.pf-row .m{flex:1;min-width:0}
.pf-row .m .a{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}
.pf-row .m .b{font-size:12.5px;color:var(--dim)}
.pf-row .v{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600}
.pf-row .v.up{color:var(--gain)}.pf-row .v.dn{color:var(--loss)}
.pf-x{background:none;border:none;color:var(--faint);font-size:15px;padding:4px}
.pf-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pf-add{flex:1;min-width:160px;font-weight:700;font-size:14px;color:var(--ink);background:var(--gain);border:none;border-radius:999px;padding:13px 0}
.pf-link{flex:1;min-width:160px;font-weight:700;font-size:13px;color:var(--text);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:12px 0}
.pf-empty{text-align:center;padding:34px 20px;color:var(--dim);font-size:14px;line-height:1.6}
.pf-empty .big{font-size:32px;margin-bottom:8px}
.composer{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:16px;align-items:center}
.composer .cavatar{width:38px;height:38px}
.composer .fake-in{flex:1;color:var(--faint);font-size:14px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:11px 16px;cursor:pointer}
.post{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;animation:slideUp .3s both}
.post .ph{display:flex;align-items:center;gap:10px}
.post .ph .cavatar{width:38px;height:38px}
.post .ph b{font-size:14px}
.post .ph small{color:var(--faint);font-size:12px}
.post .ptext{font-size:14.5px;margin-top:10px;line-height:1.5}
.tradechip{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--gain);background:var(--gaindim);border:1px solid #1E4A31;border-radius:12px;padding:7px 12px}
.pacts{display:flex;gap:16px;margin-top:12px}
.pact{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint);background:none;border:none;padding:0}
.pact.liked{color:var(--gain)}
.scrim{position:fixed;inset:0;background:#0009;z-index:40}
.slide{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:41;background:var(--ink);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slideIn .25s both}
.phead{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.backbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;width:34px;height:34px;font-size:15px}
.pname{font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px}
.followbtn{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink);background:var(--gain);border:1px solid var(--gain);border-radius:999px;padding:7px 14px}
.followbtn.on{color:var(--gain);background:transparent}
.pbody{flex:1;overflow-y:auto;padding:14px 18px 24px}
.pid{display:flex;align-items:center;gap:14px}
.pavatar{position:relative;overflow:hidden;width:58px;height:58px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:var(--dim)}
.ptype{font-size:13px;color:var(--dim)}
.pver{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gain);margin-top:2px}
.pbio{font-size:13.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;line-height:1.55}
.pstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.pstat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.pstat .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px}
.pstat .v.g{color:var(--gain)}
.pstat .l{font-size:11px;color:var(--faint);margin-top:2px}
.pchart{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.plabel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);letter-spacing:.1em;margin-bottom:10px}
.months{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);margin-top:6px}
.hold{display:flex;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--line)}
.hold .ht{font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;width:62px}
.hold .hm{flex:1}
.hold .hm .a{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}
.hold .hm .b{font-size:12.5px;color:var(--dim)}
.hold .hv{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600}
.hold .hv.up{color:var(--gain)}.hold .hv.dn{color:var(--loss)}
.pbig{width:100%;font-weight:700;font-size:15px;color:var(--ink);background:var(--gain);border:none;border-radius:999px;padding:14px 0;margin-top:18px}
.plive{background:var(--gaindim);border:1px solid #1E4A31;border-radius:16px;padding:14px;margin-top:12px}
.plive .a{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--gain);animation:pulse 1.6s infinite}
.plive .b{font-size:14px;margin-top:4px}
.overlay{position:fixed;inset:0;background:#000C;display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.sheet{width:100%;max-width:430px;background:var(--panel2);border:1px solid var(--line);border-radius:24px;padding:22px;animation:pop .22s both;max-height:88vh;overflow-y:auto}
.sheet h3{font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px}
.sheet p{font-size:13px;color:var(--dim);margin:8px 0 14px;line-height:1.55}
.amts{display:flex;gap:8px;margin-bottom:16px}
.amt{font-family:'IBM Plex Mono',monospace;flex:1;font-size:15px;font-weight:600;padding:12px 0;border-radius:14px;color:var(--text);background:var(--panel);border:1px solid var(--line)}
.amt.on{color:var(--ink);background:var(--gain);border-color:var(--gain)}
.rhbtn{width:100%;font-weight:700;font-size:15px;color:#fff;background:#00C805;border:none;border-radius:999px;padding:14px 0}
.gotit{width:100%;font-weight:700;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:12px 0;margin-top:4px}
.confirmbtn{width:100%;font-weight:700;font-size:15px;color:var(--ink);background:var(--gain);border:none;border-radius:999px;padding:14px 0}
.sheetfine{font-size:11px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.5}
.center{text-align:center}
.center .bigmark{font-size:38px;margin-bottom:6px;color:var(--gain);font-weight:700}
.f-input{width:100%;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;margin-bottom:10px;text-transform:uppercase}
.f-input:focus{border-color:var(--gain)}
.f-input::placeholder{color:var(--faint);text-transform:none}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;font-size:12.5px;font-weight:700;padding:10px 0;border-radius:12px;color:var(--dim);background:var(--panel);border:1px solid var(--line)}
.seg button.on{color:var(--ink);background:var(--gain);border-color:var(--gain)}
.seg button.on.dn{background:var(--loss);border-color:var(--loss)}
.toast{position:fixed;bottom:80px;left:0;right:0;display:flex;justify-content:center;z-index:60;pointer-events:none}
.toast div{font-size:13px;font-weight:700;color:var(--ink);background:var(--gain);border-radius:999px;padding:11px 20px;animation:pop .25s both;text-align:center;max-width:90%}
.oboverlay{position:fixed;inset:0;background:rgba(6,8,10,.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:70;padding:18px}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pick{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;color:var(--text)}
.pick .cavatar{margin:0 auto 8px}
.pick b{font-size:13px;display:block}
.pick small{color:var(--faint);font-size:11px}
.pick.on{border-color:var(--gain);background:var(--gaindim)}
.pick .pk{position:absolute;top:8px;right:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint)}
.pick.on .pk{color:var(--gain)}
.hero{padding:64px 0 40px;text-align:center;position:relative}
.hero-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 50% 25%,rgba(43,224,128,.10),transparent 70%)}
.hero>*{position:relative;z-index:2}
.hero .chrome{font-size:clamp(58px,13vw,140px);line-height:1}
.hero-tag{font-size:clamp(21px,3.6vw,30px);font-weight:700;margin-top:22px}
.hero-tag .g{color:var(--gain)}

function futuresOpen(){
  const now=new Date();
  const et=new Date(now.toLocaleString("en-US",{timeZone:"America/New_York"}));
  const d=et.getDay(), h=et.getHours();
  if(d===6) return false;                       // Saturday
  if(d===0) return h>=18;                       // Sunday opens 6pm
  if(d===5) return h<17;                        // Friday closes 5pm
  return !(h===17);                             // daily 5-6pm break
}

function hashOf(str){ let h=0; for(let i=0;i<str.length;i++){ h=((h<<5)-h+str.charCodeAt(i))|0; } return Math.abs(h); }
const AV_PAIRS = [["#2BE080","#0E5C36"],["#7DB8FF","#123A5C"],["#FFB84D","#5C3A10"],["#FF5C7A","#5C1E2A"],["#9D6BFF","#2E1A5C"],["#43E8C8","#0E4A44"]];
function pfp(name, mg){
  const h=hashOf(String(name||"x"));
  const p=AV_PAIRS[h%AV_PAIRS.length];
  const ini=(mg||String(name||"?").slice(0,2)).toUpperCase().slice(0,3);
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0%" stop-color="'+p[0]+'"/><stop offset="100%" stop-color="'+p[1]+'"/></linearGradient></defs>'+
    '<rect width="100" height="100" fill="url(#g)"/>'+
    '<circle cx="'+(20+h%20)+'" cy="'+(78-h%16)+'" r="'+(26+h%14)+'" fill="#FFFFFF" opacity="0.10"/>'+
    '<text x="50" y="50" font-family="IBM Plex Mono, monospace" font-size="34" font-weight="600" fill="#0B0E11" '+
    'text-anchor="middle" dominant-baseline="central" opacity="0.85">'+ini+'</text></svg>';
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function applyPic(id, src){
  PICS[id]=src;
  try{ lsSet("robit_pics", JSON.stringify(PICS)); }catch(e){}
  document.querySelectorAll('[data-av="'+id+'"] img').forEach(im=>{ im.src=src; });
}
function av(t, cls){
  cls = cls || "cavatar";
  const fb = pfp(t.name||t.h||t.mg||"x", t.mg);
  const src = (t.id && PICS[t.id]) || t.img || fb;
  return '<div class="'+cls+'" data-av="'+(t.id||"")+'"><img src="'+src+'" alt="" loading="lazy" '+
    'onerror="this.onerror=null;this.src=\''+fb+'\'"><span>'+t.mg+'</span></div>';
}
function loadPics(){
  if(typeof fetch!=="function") return;
  const need = TRADERS.filter(t=>t.wiki && !PICS["w_"+t.id]);
  if(!need.length) return;
  const titles = need.map(t=>t.wiki).join("|");
  fetch("https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=256&titles="+encodeURIComponent(titles))
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      const pages = d && d.query && d.query.pages; if(!pages) return;
      Object.keys(pages).forEach(k=>{
        const pg=pages[k]; if(!pg||!pg.thumbnail||!pg.thumbnail.source) return;
        const t = need.find(x=>x.wiki.toLowerCase()===String(pg.title||"").toLowerCase());
        if(!t) return;
        PICS["w_"+t.id]=1;
        applyPic(t.id, pg.thumbnail.source);
      });
    }).catch(()=>{});
}

function spark(t,w,h){
  const d=t.spark, min=Math.min(...d), max=Math.max(...d);
  const pts=d.map((v,i)=>((i/(d.length-1))*w)+","+(h-((v-min)/(max-min||1))*h)).join(" ");
  const ly=h-((d[d.length-1]-min)/(max-min||1))*h;
  return '<svg width="'+w+'" height="'+h+'" style="display:block;overflow:visible"><polyline points="'+pts+'" fill="none" stroke="#2BE080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+w+'" cy="'+ly+'" r="2.6" fill="#2BE080"/></svg>';
}

  const detail = x.dterm ? jarg(x.dterm,x.detail) : x.detail;
  const badgeInner = t.bterm ? jarg(t.bterm,t.badge[1]) : t.badge[1];
  const dirCls = x.gain>=0 ? "up" : "dn";
  const arrow = x.act==="SOLD"||x.act==="SHORT" ? "▼" : "▲";
  return '<div class="card'+(x.live?" livecard":"")+'" style="animation-delay:'+(i*0.03)+'s">'+
    '<div class="chead" onclick="openProfile(\''+t.id+'\')">'+av(t)+
      '<div style="flex:1;min-width:0"><div class="cname">'+t.name+' <span>· '+t.type+' ›</span></div>'+
      '<div class="cstat mono">+'+t.ret+'% this yr · '+t.win+'% wins</div></div>'+spark(t,84,26)+'</div>'+
    '<div class="movebox'+(x.live?" livebox":"")+'">'+
      '<div class="movetop"><span class="movelabel">'+x.ago.toUpperCase()+'</span>'+
        (i<2?'<span class="badge new">NEW</span>':'')+(x.hot?'<span class="badge hot">🔥 HOT</span>':'')+
        '<span class="badge '+t.badge[0]+' right">'+badgeInner+'</span></div>'+
      '<div class="moveline"><span class="dir '+dirCls+'">'+arrow+' '+x.act+'</span><span class="tkr">'+x.tkr+'</span><span class="movewhat">'+x.what+'</span></div>'+
      '<div class="movemeta">'+detail+' · '+x.amt+'</div>'+
      '<div class="sincebar"><div class="sincel">SINCE THEY ENTERED</div><div class="sincev '+(x.gain>=0?"up":"dn")+'">'+(x.gain>=0?"+":"")+x.gain.toFixed(1)+'%</div>'+
        (x.style?'<span class="stag" onclick="event.stopPropagation();setStyle(\''+x.style+'\')">'+x.style+'</span>':'')+'</div>'+
      (x.plain?'<div class="plain"><b>In plain English:</b> '+x.plain+'</div>':'')+
      '<div class="btnrow">'+
        '<button class="copybtn" onclick="openCopy(\''+t.id+'\',\''+x.tkr+'\','+(t.futures?"true":"false")+')">'+(t.futures?"Watch this trade":"Copy on Robinhood")+'</button>'+
        '<button class="whobtn" onclick="openWho(\''+t.id+'\')">Who?</button>'+
        '<button class="votebtn'+(v==="bull"?" bull":"")+'" onclick="vote(\''+t.id+x.tkr+'\',\'bull\')">BULL</button>'+
      '</div>'+
    '</div></div>';
}
function futCard(t,i){
  const L=t.live_trade;
  const live = L && L.basePts!==undefined;
  const stat = live
    ? '<b class="'+(L.basePts+S.jitter*3>=0?"up":"dn")+'" id="lv-'+t.id+'">'+(L.basePts>=0?"+":"")+L.basePts.toFixed(0)+' pts</b>'
    : '<b class="up">'+(L?L.closed:"—")+'</b>';
  const right = t.live
    ? '<span class="mono" style="font-size:10.5px;font-weight:600;color:#2BE080;animation:pulse 1.6s infinite">● LIVE</span>'
    : spark(t,84,26);
  return '<div class="card'+(t.live?" livecard":"")+'" style="animation-delay:'+(i*0.04)+'s">'+
    '<div class="chead" onclick="openProfile(\''+t.id+'\')">'+av(t)+
      '<div style="flex:1"><div class="cname">'+t.name+' <span>· '+t.type+' ›</span></div>'+
      '<div class="cstat mono">+'+t.ret+'% yr'+(t.streak>0?' <span class="amber">· W'+t.streak+' streak</span>':'')+'</div></div>'+right+'</div>'+
    '<div class="movebox'+(t.live?" livebox":"")+'">'+
      '<div class="moveline"><span class="dir '+(L&&L.dir==="LONG"?"up":"dn")+'">'+jarg(L&&L.dir==="LONG"?"long":"short",(L&&L.dir==="LONG"?"▲ LONG":"▼ SHORT"))+'</span>'+
      '<span class="tkr" style="font-size:21px">'+(L?L.tkr:"")+'</span><span class="movewhat">'+(L?L.what:"")+'</span></div>'+
      '<div class="entry">entry '+(L?L.entry.toLocaleString():"")+' · '+stat+'</div>'+
      '<div class="btnrow"><button class="copybtn" onclick="openCopy(\''+t.id+'\',\''+(L?L.tkr:"")+'\',true)">Watch this trade</button>'+
      '<button class="whobtn" onclick="openWho(\''+t.id+'\')">Who?</button></div>'+
    '</div></div>';
}

function calcHTML(){

  return '<div class="calc"><h2>What if you\'d copied them?</h2>'+
    '<p class="csub">Your money. Their moves. Last 12 months.</p>'+
    '<div class="calclabel">IF YOU PUT IN</div>'+

function setCalc(amt,who){
  if(amt) CALC.amt=amt; if(who) CALC.who=who;
  render();
  const el=$("calcnum"); if(!el) return;
  const target=CALC.amt*(byId(CALC.who).ret/100); const st=performance.now();
  function step(now){ const p=Math.min((now-st)/500,1); el.textContent="+$"+(target*p).toFixed(2); if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

  let mid='<div style="margin-top:14px"><div class="plabel">WHAT THEY HOLD</div>'+

      return '<div class="hold"><span class="ht">'+p.tkr+'</span><div class="hm"><div class="a">'+p.dir+' · in at '+p.entry+'</div><div class="b">'+p.note+'</div></div>'+
        '<span class="hv '+(v>=0?"up":"dn")+'">'+(v>=0?"+":"")+v.toFixed(1)+'%</span></div>';}).join("")+'</div>'+
    '<div style="margin-top:14px"><div class="plabel">RECENT TRADES</div>'+
    t.trades.map(x=>'<div class="hold"><span class="ht" style="font-size:14px">'+x.tkr+'</span><div class="hm"><div class="a">'+x.act+' · '+x.ago+'</div><div class="b">'+x.what+'</div></div>'+
      '<span class="hv '+(x.gain>=0?"up":"dn")+'">'+(x.gain>=0?"+":"")+x.gain.toFixed(1)+'%</span></div>').join("")+'</div>';
  if(L && L.basePts!==undefined){
    const lp=L.basePts+S.jitter*3;
    mid+='<div class="plive"><div class="a">● IN A TRADE RIGHT NOW</div><div class="b">'+jarg(L.dir==="LONG"?"long":"short",L.dir)+' '+L.tkr+' from '+L.entry.toLocaleString()+
      ' · <b class="mono" id="lvp-'+t.id+'" style="color:'+(lp>=0?"#2BE080":"#FF5C7A")+'">'+(lp>=0?"+":"")+lp.toFixed(0)+' pts</b></div></div>';
  }
  return '<div class="scrim" onclick="closeProfile()"></div><div class="slide">'+
    '<div class="phead"><button class="backbtn" onclick="closeProfile()">✕</button><span class="pname">'+t.name+'</span>'+
    '<button class="followbtn'+(fol?" on":"")+'" onclick="toggleFollow(\''+t.id+'\')">'+(fol?"✓ Following":"+ Follow")+'</button></div>'+
    '<div class="pbody">'+
      '<div class="pid">'+av(t,"pavatar")+'<div><div class="ptype">'+t.type+' · '+CATS[t.cat]+' · '+t.followers+' followers</div>'+
      '<div class="pver">'+jarg("verified","✓ verified")+' returns</div></div></div>'+
      '<div class="pbio"><b style="color:#F2F5F3">Who is this?</b><br>'+t.bio+'</div>'+
      '<div class="pstats">'+
        '<div class="pstat"><div class="v g">+'+t.ret+'%</div><div class="l">This year</div></div>'+
        '<div class="pstat"><div class="v">'+t.win+'%</div><div class="l">Win rate</div></div>'+
        '<div class="pstat"><div class="v g">+'+best.gain.toFixed(1)+'%</div><div class="l">Best trade</div></div></div>'+
      '<div class="pchart"><div class="plabel">12-MONTH RETURN</div>'+spark(t,360,70)+
      '<div class="months"><span>SEP</span><span>DEC</span><span>MAR</span><span>AUG</span></div></div>'+
      mid+
      '<button class="pbig" onclick="openCopy(\''+t.id+'\',\''+t.trades[0].tkr+'\','+(t.futures?"true":"false")+')">'+
      (t.futures?("Watch "+t.trades[0].tkr+" on Robinhood"):("Copy their "+t.trades[0].tkr+" move"))+'</button>'+
    '</div></div>';
}
function sheetHTML(){
  let out="";
  if(S.who){
    const t=byId(S.who);
    out+='<div class="overlay" onclick="closeWho()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<div style="display:flex;align-items:center;gap:12px">'+av(t,"pavatar")+'<div><h3>'+t.name+'</h3><p style="margin:2px 0 0">'+t.type+' · '+CATS[t.cat]+'</p></div></div>'+
      '<p style="margin-top:14px">'+t.bio+'</p>'+
      '<button class="confirmbtn" onclick="closeWho();openProfile(\''+t.id+'\')">See their trades</button>'+
      '<button class="gotit" onclick="closeWho()" style="margin-top:8px">Close</button></div></div>';
  }
  if(S.modal && S.modal.kind==="copy"){
    const t=byId(S.modal.id), fut=S.modal.fut, tkr=S.modal.tkr;
    if(S.modalStep===0){
      out+= fut
        ? '<div class="overlay" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()">'+
          '<h3>'+t.name+' is trading '+tkr+'</h3><p>Futures are the deep end — they need approval on Robinhood and can lose money in minutes. Watching how '+t.name+' manages this is free education.</p>'+
          '<button class="rhbtn" onclick="closeModal()">Open '+tkr+' in Robinhood →</button>'+
          '<div class="sheetfine">You place trades yourself. robit never touches your money. Not investment advice.</div></div></div>'
        : '<div class="overlay" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()">'+
          '<h3>Copy '+t.name+'\'s '+tkr+' move</h3><p>Start with $50 — fractional shares mean you own a real slice:</p>'+
          '<div class="amts">'+[25,50,100].map(v=>'<button class="amt'+(S.modalAmt===v?" on":"")+'" onclick="setAmt('+v+')">$'+v+'</button>').join("")+'</div>'+
          '<p style="margin-top:0">Your $'+S.modalAmt+' rides the same wave as their millions — and robit tracks it in your Portfolio.</p>'+
          '<button class="rhbtn" onclick="modalNext()">Open $'+S.modalAmt+' of '+tkr+' in Robinhood →</button>'+
          '<div class="sheetfine">You place the trade yourself. robit never touches your money. Not investment advice.</div></div></div>';
    } else {
      out+='<div class="overlay" onclick="closeModal()"><div class="sheet center" onclick="event.stopPropagation()">'+
        '<div class="bigmark">✓</div><h3>Robinhood opens here</h3><p>At launch, a deep link opens this straight in Robinhood. Two taps and you\'re in — then robit tracks it for you.</p>'+
        '<button class="confirmbtn" onclick="confirmCopy()">I made the trade</button></div></div>';
    }
  }
  if(S.modal && S.modal.kind==="add"){
    const f=S.addForm;
    out+='<div class="overlay" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<h3>Log a trade</h3><p>Track anything you\'ve traded — robit does the P/L math.</p>'+
      '<input class="f-input" placeholder="Ticker (e.g. NVDA, NQ, SPY)" value="'+esc(f.tkr)+'" oninput="S.addForm.tkr=this.value">'+
      '<div class="seg">'+["Stock","Option","Futures"].map(x=>'<button class="'+(f.type===x?"on":"")+'" onclick="S.addForm.type=\''+x+'\';renderLayer()">'+x+'</button>').join("")+'</div>'+
      '<div class="seg"><button class="'+(f.dir==="LONG"?"on":"")+'" onclick="S.addForm.dir=\'LONG\';renderLayer()">▲ Long</button>'+
      '<button class="'+(f.dir==="SHORT"?"on dn":"")+'" onclick="S.addForm.dir=\'SHORT\';renderLayer()">▼ Short</button></div>'+
      '<input class="f-input" placeholder="Amount in $ (e.g. 50)" inputmode="numeric" value="'+esc(f.amt)+'" oninput="S.addForm.amt=this.value">'+
      '<button class="confirmbtn" onclick="saveTrade()">Add to portfolio</button>'+
      '<div class="sheetfine">'+(S.user?"Saved to your account.":"Guest mode — saved on this device.")+'</div></div></div>';
  }
  if(S.modal && S.modal.kind==="post"){
    const f=S.postForm;
    out+='<div class="overlay" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<h3>Post to the community</h3><p>Your take, your trade, your win (or L — those get the most love).</p>'+
      '<input class="f-input" style="text-transform:none" placeholder="What\'s happening…" value="'+esc(f.text)+'" oninput="S.postForm.text=this.value">'+
      '<input class="f-input" placeholder="Ticker (optional)" value="'+esc(f.tkr)+'" oninput="S.postForm.tkr=this.value">'+
      '<input class="f-input" placeholder="$ amount (optional)" inputmode="numeric" value="'+esc(f.amt)+'" oninput="S.postForm.amt=this.value">'+
      '<button class="confirmbtn" onclick="savePost()">Post</button>'+
      '<div class="sheetfine">Preview mode — posts live in this browser.</div></div></div>';
  }
  if(S.dict && DICT[S.dict]){
    const d=DICT[S.dict];
    out+='<div class="overlay" style="z-index:55" onclick="closeDict()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<h3>'+d[0]+'</h3><p>'+d[1]+'</p><button class="gotit" onclick="closeDict()">Got it</button></div></div>';
  }
  if(S.toast) out+='<div class="toast"><div>'+S.toast+'</div></div>';
  return out;
}
function bellHTML(){
  if(!S.bell) return "";
  return '<div class="overlay" style="align-items:flex-start;padding-top:70px" onclick="closeBell()"><div class="sheet" onclick="event.stopPropagation()">'+
    '<h3>Alerts</h3><p>What just dropped from the people you follow.</p>'+
    ALERTS.map(a=>{const t=byId(a.who);
      return '<div class="alertrow" onclick="closeBell();openProfile(\''+a.who+'\')">'+av(t,"savatar")+
      '<div style="flex:1"><div style="font-size:13.5px">'+a.txt+'</div><div class="mono" style="font-size:11px;color:#5F6C65">'+a.time+'</div></div>'+
      (a.hot?'<span class="badge hot">NEW</span>':'')+'</div>';}).join("")+
    '<div class="sheetfine">At launch, Pro members get these the second they file — hours before anyone else.</div>'+
    '<button class="gotit" onclick="closeBell()">Close</button></div></div>';
}
function renderLayer(){ $("layer").innerHTML = obHTML() + (S.profile?profileHTML():"") + sheetHTML() + bellHTML(); }

// ============ actions ============
function setFilter(f){ S.filter=f; render(); }
function setStyle(x){ S.style=x; render(); }
function vote(k,side){ S.votes[k]=S.votes[k]===side?undefined:side; render(); }
function toggleFollow(id){ S.follows[id]=!S.follows[id]; saveAll(); renderLayer(); }
function openProfile(id){ S.profile=id; renderLayer(); document.body.style.overflow="hidden"; }
function closeProfile(){ S.profile=null; renderLayer(); document.body.style.overflow=""; }
function openWho(id){ S.who=id; renderLayer(); }
function closeWho(){ S.who=null; renderLayer(); }
function openCopy(id,tkr,fut){ S.modal={kind:"copy",id:id,tkr:tkr,fut:fut}; S.modalStep=0; S.modalAmt=50; renderLayer(); }
function openAdd(){ S.modal={kind:"add"}; S.addForm={tkr:"",type:"Stock",dir:"LONG",amt:""}; renderLayer(); }
function openPost(){ S.modal={kind:"post"}; S.postForm={text:"",tkr:"",amt:""}; renderLayer(); }
function closeModal(){ S.modal=null; renderLayer(); }
function setAmt(v){ S.modalAmt=v; renderLayer(); }
function modalNext(){ S.modalStep=1; renderLayer(); }
function confirmCopy(){
  const t=byId(S.modal.id), tkr=S.modal.tkr, amt=S.modalAmt;
  S.port.push({tkr:tkr,type:"Stock",dir:"LONG",amt:amt,base:0,seed:Math.random()*10,src:"Copied from "+t.name});
  saveAll(); S.modal=null; S.profile=null; document.body.style.overflow="";
  render(); toast("Tracking your $"+amt+" "+tkr+" copy 🎯");
}
function saveTrade(){
  const f=S.addForm;
  if(!f.tkr.trim()||!f.amt||isNaN(+f.amt)||+f.amt<=0){ toast("Add a ticker and a $ amount"); return; }
  S.port.push({tkr:f.tkr.trim().toUpperCase().slice(0,6),type:f.type,dir:f.dir,amt:+f.amt,base:0,seed:Math.random()*10,src:"Logged by you"});
  saveAll(); S.modal=null; S.page="portfolio"; render(); toast(f.tkr.trim().toUpperCase()+" added to your portfolio 🎯");
}
function delTrade(i){ S.port.splice(i,1); if(!S.port.length) lsSet("robit_cleared","1"); saveAll(); render(); }
function likePost(i){ S.plikes[i]=!S.plikes[i]; render(); }
function savePost(){
  const f=S.postForm;
  if(!f.text.trim()){ toast("Write something first"); return; }
  POSTS.unshift({h:"@you",mg:"YOU",time:"now",text:f.text.trim(),tkr:f.tkr?f.tkr.trim().toUpperCase().slice(0,6):null,amt:f.amt?+f.amt:null,likes:0,com:0});
  S.modal=null; render(); toast("Posted to the community 🎯");
}
function openBell(){ S.bell=true; S.unread=0; renderNav(); renderLayer(); }
function closeBell(){ S.bell=false; renderLayer(); }
function openDict(t){ S.dict=t; renderLayer(); }
function closeDict(){ S.dict=null; renderLayer(); }

// ============ render ============
function setupReveal(){
  if(!("IntersectionObserver" in window)){ document.querySelectorAll(".rev").forEach(e=>e.classList.add("in")); return; }
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }),{threshold:.1});
  document.querySelectorAll(".rev").forEach(e=>io.observe(e));
}
function render(){
  renderNav();
  const p=S.page;
  $("main").innerHTML = p==="home"?pageHome() : p==="feed"?pageFeed() : p==="futures"?pageFutures()
    : p==="social"?pageSocial() : p==="ranks"?pageRanks() : pagePortfolio();
  $("legal").innerHTML = "<b style='color:#9AA8A0'>Risk warning.</b> Trading stocks, options and futures involves substantial risk of loss and is not suitable for everyone. You can lose some or all of the money you put in, and with leveraged products such as futures your losses can exceed your deposit. Copying another person's trade does not reduce that risk — their finances, timing and goals are not yours. Only trade money you can afford to lose, and consider speaking to a licensed financial professional.<br><br>robit displays public filings and publicly shared trades for information and entertainment only. Nothing here is investment advice. robit never holds funds or places trades; broker connections are read-only. Congressional filings can lag actual trades by up to 45 days. Trading — especially options and futures — involves serious risk, including losing everything you put in. Early preview: returns, win rates and dollar figures shown are illustrative estimates, not verified performance. robit is not affiliated with, sponsored by, or endorsed by any person shown.";
  renderLayer();
  setupReveal();
  loadPics();
}
// live tick WITHOUT full re-render (no flicker)
let ribI=0;
setInterval(()=>{
  const el=$("ribtext"); if(el){ ribI=(ribI+1)%ACTIVITY.length; el.style.opacity=0;
    setTimeout(()=>{ el.textContent=ACTIVITY[ribI]; el.style.opacity=1; },220); }
},3400);
setInterval(()=>{
  S.jitter=+(Math.sin(Date.now()/1400)*1.8).toFixed(2);
  FUTS.forEach(t=>{
    const L=t.live_trade; if(!L||L.basePts===undefined) return;
    const v=L.basePts+S.jitter*3;
    [$("lv-"+t.id),$("lvp-"+t.id)].forEach(el=>{
      if(!el) return;
      el.textContent=(v>=0?"+":"")+v.toFixed(0)+" pts";
      el.style.color = v>=0 ? "#2BE080" : "#FF5C7A";
    });
  });
},1600);
initAuth();
render();
</script>
</body></html>
